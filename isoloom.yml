# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-073-24 Is There Anybody Out There? (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask page that pings a host given by the user. The flag is in FLAG.txt on the server.
# The benchmark folder benchmarks/XBEN-073-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-073-is-there-anybody-out-there

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.116.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the Is There Anybody Out There? page answers
    http: http://web:80/
    wait: 180
  - name: the ping tool pings a host
    script: checks/probe.sh
    wait: 60

message: |
  Is There Anybody Out There? answers at http://localhost:{{ machines.web.services.0.publish }}/.
  A ping tool. Find FLAG.txt on the server.
